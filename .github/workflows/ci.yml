name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CONTAINERLAB_VERSION: 0.82.0

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "scripts=$(ls scripts/*.sh | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  # One job per script, so each has its own log URL to share.
  script:
    needs: list
    name: ${{ matrix.script }}
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.list.outputs.scripts) }}
    runs-on: ubuntu-latest
    # Alpine container driving the runner's Docker daemon. Containerlab
    # needs the host PID and network namespaces to wire up lab links.
    # Container jobs can't use --network=host, so scripts run under
    # nsenter into PID 1's network namespace instead.
    container:
      image: alpine:3.22
      options: >-
        --privileged
        --pid=host
        -v /var/run/netns:/var/run/netns
        -v /var/lib/docker/containers:/var/lib/docker/containers
    steps:
      - name: Install Docker CLI and containerlab
        run: |
          apk add --no-cache docker-cli git iproute2 curl util-linux-misc
          curl -fsSLo /tmp/clab.apk \
            "https://github.com/srl-labs/containerlab/releases/download/v${CONTAINERLAB_VERSION}/containerlab_${CONTAINERLAB_VERSION}_linux_amd64.apk"
          apk add --no-cache --allow-untrusted /tmp/clab.apk
          docker version
          containerlab version

      - uses: actions/checkout@v4

      - name: Run ${{ matrix.script }}
        run: nsenter --target 1 --net sh "scripts/${{ matrix.script }})"
